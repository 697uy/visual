<!DOCTYPE html>
<html>
<head>
    <title>Product Cards</title>

    <style>
        .cards {
            display: flex;
            gap: 20px;
        }

        .card {
            padding: 15px;
            border: 2px solid;
            border-radius: 10px;
        }

        h2, h3 {
            text-align: center;
        }

        button {
            width: 100%;
            padding: 12px;
            color: white;
            border: none;
        }

        button:hover {
            opacity: 0.6;
        }

        .blue h2 { color: blue; }
        .green h2 { color: green; }
        .purple h2 { color: purple; }

        .blue button { background: blue; }
        .green button { background: green; }
        .purple button { background: purple; }
    </style>
</head>

<body>

<div class="cards">

    <div class="card blue">
        <h2>PRODUCT NAME</h2>
        <h3>$99.99</h3>
        <p>This is a brief description of the product and its features. It looks great!</p>
        <button>BUY NOW</button>
    </div>

    <div class="card green">
        <h2>PRODUCT NAME</h2>
        <h3>$99.99</h3>
        <p>This is a brief description of the product and its features. It looks great!</p>
        <button>BUY NOW</button>
    </div>

    <div class="card purple">
        <h2>PRODUCT NAME</h2>
        <h3>$99.99</h3>
        <p>This is a brief description of the product and its features. It looks great!</p>
        <button>BUY NOW</button>
    </div>

</div>

</body>
</html>
